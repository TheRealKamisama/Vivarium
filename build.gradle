plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id + "-" + minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

repositories {
    mavenLocal()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

minecraft {
    accessTransformers {
        file("src/main/resources/META-INF/accesstransformer.cfg")
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
    }

    // Headless-ish verification run: loads, checks every compressed atlas, writes vivarium-selftest.txt, exits.
    selftest {
        configure('client')
        systemProperty 'vivarium.selftest', 'true'
        // -Pworld=true: also create a world and take a screenshot; -Pdisable=true: A/B run without compression
        systemProperty 'vivarium.selftest.world', (project.findProperty('world') ?: 'false').toString()
        systemProperty 'vivarium.disable', (project.findProperty('disable') ?: 'false').toString()
        systemProperty 'vivarium.selftest.tag', (project.findProperty('tag') ?: 'run').toString()
    }

}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Dev-only compatibility testing (never shipped, never required at runtime), e.g.
    //   ./gradlew runSelftest -Psodium=mc1.21.1-0.6.13-neoforge
    //   ./gradlew runSelftest -Psodium=mc1.21.1-0.8.13-neoforge -Piris=1.8.14-beta.1+1.21.1-neoforge
    if (project.hasProperty('sodium')) {
        localRuntime "maven.modrinth:sodium:${project.property('sodium')}"
    }
    if (project.hasProperty('iris')) {
        localRuntime "maven.modrinth:iris:${project.property('iris')}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
